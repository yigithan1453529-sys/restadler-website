<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Toast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&display=swap">
<style>
/* Layout: full-bleed 3D office; HUD = sticky notes stuck to the screen corners; menus = typed internal memos with a rubber stamp */
:root{
  --ink:#1d2742;        /* ballpoint blue-black */
  --paper:#fdfdfb;      /* copier paper */
  --rule:#cfdcf2;       /* ruled lines */
  --sticky:#ffe45c;     /* post-it yellow */
  --sticky-dark:#e8c935;
  --stamp:#c8102e;      /* rubber stamp red */
  --ok:#1f7a4d;         /* green check */
  --scrim:rgba(18,22,36,.55);
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --type:"Special Elite","Courier New",Courier,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#2b2f3a;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#aim{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}

/* ---------- sticky-note HUD ---------- */
.note{position:fixed;background:var(--sticky);color:var(--ink);font-family:var(--hand);padding:10px 14px 12px;box-shadow:0 1px 0 var(--sticky-dark) inset,0 8px 16px -6px rgba(0,0,0,.45);line-height:1.05;pointer-events:none}
.note::before{content:"";position:absolute;left:50%;top:-8px;width:54px;height:16px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#noteLevel{top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));transform:rotate(-2deg);min-width:150px}
#noteScore{top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));transform:rotate(2.2deg);text-align:right;min-width:96px}
.n-small{font-size:17px;opacity:.8}
.n-big{font-size:28px;font-weight:700}
.n-row{font-size:21px;margin-top:2px}
#hScore{font-variant-numeric:tabular-nums}
.balls{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;max-width:170px}
.balls i{width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);box-sizing:border-box;display:block}
.balls i.hit{background:var(--ok);border-color:var(--ok)}
.balls i.miss{background:transparent;border-color:rgba(29,39,66,.35);position:relative}
.balls i.miss::after{content:"";position:absolute;inset:4px -1px;border-top:1.5px solid rgba(29,39,66,.55);transform:rotate(45deg)}

#wind{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(253,253,251,.92);color:var(--ink);padding:6px 14px;border-radius:999px;font-family:var(--type);font-size:14px;letter-spacing:.04em;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
#wind svg{width:34px;height:14px;transition:transform .3s}
#wind b{font-variant-numeric:tabular-nums;font-weight:400;min-width:2.4em;text-align:left}

#mute{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(253,253,251,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#mute:focus-visible,.btn:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}
#mute svg{width:22px;height:22px}

#hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--hand);font-size:26px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}

#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;font-family:var(--hand);color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.55);opacity:0}
#toast .t1{font-size:clamp(44px,9vw,76px);font-weight:700;line-height:1}
#toast .t2{font-size:clamp(22px,4.5vw,32px)}
#toast.show{animation:pop 1.25s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

/* ---------- memo overlays ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--scrim);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-sizing:border-box}
.memo{position:relative;width:min(520px,100%);box-sizing:border-box;background:var(--paper);color:var(--ink);padding:26px 28px 24px;transform:rotate(-.6deg);box-shadow:0 22px 50px -12px rgba(0,0,0,.6);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-position:0 120px;animation:slide .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slide{from{transform:translateY(40px) rotate(-3deg);opacity:0}}
.memo h1{font-family:var(--type);font-weight:400;font-size:13px;letter-spacing:.32em;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.meta{font-family:var(--type);font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-bottom:16px}
.meta span:nth-child(odd){opacity:.6}
.memo .big{font-family:var(--hand);font-size:clamp(46px,11vw,68px);font-weight:700;line-height:.95;margin:4px 0 10px;text-wrap:balance}
.memo p{font-size:15.5px;line-height:28px;margin:0 0 0;max-width:62ch}
.memo .hand{font-family:var(--hand);font-size:22px;line-height:28px}
.memo .stars{font-size:30px;letter-spacing:4px;color:#e2a400;line-height:28px}
.memo .stars .off{color:#d6d6d6}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--type);font-size:13px;margin:6px 0 4px}
.facts span{white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font-family:var(--hand);font-size:25px;font-weight:700;border:2px solid var(--ink);background:var(--sticky);color:var(--ink);padding:6px 20px 8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.stamp{position:absolute;right:20px;top:62px;font-family:var(--type);font-size:24px;letter-spacing:.12em;color:var(--stamp);border:3px solid var(--stamp);padding:4px 10px;transform:rotate(-12deg);opacity:.85;mix-blend-mode:multiply;animation:stamp .35s .25s both cubic-bezier(.3,1.6,.5,1)}
.stamp.green{color:var(--ok);border-color:var(--ok)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
.credit{font-size:11.5px;line-height:1.5;margin-top:18px;opacity:.6}
.credit a{color:inherit}
#loading{font-family:var(--type);font-size:13px;opacity:.7;margin-top:10px}
@media (max-width:480px){
  .memo{padding:22px 18px 20px}
  .note{padding:8px 11px 10px}
  .n-big{font-size:23px}.n-row{font-size:19px}.n-small{font-size:15px}
  #noteLevel{min-width:0}
  #wind{top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12px}
  #hint{bottom:calc(70px + env(safe-area-inset-bottom,0px));font-size:22px}
  .stamp{font-size:18px;top:56px;right:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>

<div id="stage"></div>
<canvas id="aim"></canvas>

<div id="hud" hidden>
  <div class="note" id="noteLevel">
    <div class="n-small">Stufe <span id="hLevel">1</span></div>
    <div class="n-big" id="hTitle">Praktikum</div>
    <div class="n-row">Treffer <span id="hHits">0</span> / <span id="hNeed">3</span></div>
    <div class="balls" id="hBalls"></div>
  </div>
  <div class="note" id="noteScore">
    <div class="n-small">Punkte</div>
    <div class="n-big" id="hScore">0</div>
    <div class="n-small">Rekord <span id="hBest">0</span></div>
  </div>
  <div id="wind" aria-live="polite">WIND
    <svg viewBox="0 0 34 14" aria-hidden="true"><path d="M2 7h26M22 2l7 5-7 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b id="hWind">0.0</b>
  </div>
</div>
<div id="hint" hidden>↑ nach oben wischen &amp; loslassen</div>
<div id="toast"><div class="t1"></div><div class="t2"></div></div>
<button id="mute" aria-label="Ton aus" title="Ton an/aus">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="muteX" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
</button>
<div class="overlay" id="menu"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);

/* ================= levels ================= */
// d = distance (m), s = bin scale, w = max wind (m/s²), m = moving amplitude (m), need = hits of 10
const LEVELS=[
  {t:'Praktikum',        d:3.0, s:1.60, w:0,   m:0,   need:3},
  {t:'Lehre',            d:3.6, s:1.50, w:0.6, m:0,   need:4},
  {t:'Sachbearbeitung',  d:4.2, s:1.40, w:1.0, m:0,   need:4},
  {t:'Teamleitung',      d:4.8, s:1.30, w:1.4, m:0,   need:5},
  {t:'Abteilungsleitung',d:5.4, s:1.20, w:1.2, m:0.5, need:4},
  {t:'Bereichsleitung',  d:6.0, s:1.15, w:2.0, m:0,   need:5},
  {t:'Direktion',        d:6.6, s:1.10, w:1.8, m:0.8, need:4},
  {t:'Vizepräsidium',    d:7.2, s:1.00, w:2.6, m:0,   need:5},
  {t:'CEO',              d:7.8, s:0.95, w:2.4, m:1.0, need:4},
  {t:'Verwaltungsrat',   d:8.4, s:0.90, w:3.0, m:1.1, need:5},
];
function levelDef(i){
  if(i<LEVELS.length) return LEVELS[i];
  const k=i-LEVELS.length+1;
  return {t:'Legende '+['I','II','III','IV','V','VI','VII','VIII','IX','X'][Math.min(k-1,9)]+(k>10?'+':''),
    d:Math.min(9.6,8.4+k*0.25), s:Math.max(0.72,0.9-k*0.03), w:Math.min(4,3+k*0.15), m:(k%2?1.2:0), need:5};
}
const THROWS=10;

/* ================= storage ================= */
const store={get(k,d){try{const v=localStorage.getItem('papertoast.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
             set(k,v){try{localStorage.setItem('papertoast.'+k,JSON.stringify(v))}catch(e){}}};
let best=store.get('best',0), bestLevel=store.get('bestLevel',0), muted=store.get('muted',false);

/* ================= audio ================= */
let AC=null,noiseBuf=null;
function ac(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function noise(dur,freq,q,gain,type,when){
  const a=ac();if(!a||muted)return;const t=a.currentTime+(when||0);
  const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f).connect(g).connect(a.destination);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
function tone(freq,dur,gain,type,when,slide){
  const a=ac();if(!a||muted)return;const t=a.currentTime+(when||0);
  const o=a.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  const g=a.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05);
}
const sfx={
  crumple(){for(let i=0;i<5;i++)noise(0.06,1800+Math.random()*2500,1.2,0.18,'bandpass',i*0.035);},
  whoosh(){noise(0.28,900,0.7,0.22,'bandpass');},
  rim(v){const g=Math.min(0.16,0.04+v*0.03);tone(1180,0.45,g,'triangle');tone(1790,0.3,g*0.5,'sine');tone(2630,0.18,g*0.3,'sine');},
  paper(){noise(0.22,2600,1.4,0.28);noise(0.12,350,1,0.25,'lowpass',0.03);},
  thud(v){noise(0.1,260,1,Math.min(0.3,0.08+v*0.05),'lowpass');},
  swish(){[880,1175,1568].forEach((f,i)=>tone(f,0.3,0.08,'sine',i*0.06));},
  win(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.32,0.11,'triangle',i*0.09));},
  fail(){[392,330,262].forEach((f,i)=>tone(f,0.35,0.1,'square',i*0.14,f*0.97));},
  stamp(){noise(0.09,180,0.8,0.5,'lowpass');},
};

/* ================= three.js setup ================= */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=0.92;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);
const canvas=renderer.domElement;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x3a2a1e);
scene.fog=new THREE.Fog(0x3a2a1e,16,30);
const camera=new THREE.PerspectiveCamera(50,1,0.05,60);
const CAM=new THREE.Vector3(0,1.3,0.45);
camera.position.copy(CAM);

function tex(w,h,draw,rep){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;
  if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);}
  return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---- environment & lights (warm interior, daylight from the window side) ---- */
if(THREE.RoomEnvironment){const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(new THREE.RoomEnvironment(),0.04).texture;}
scene.add(new THREE.HemisphereLight(0xfff4e6,0x6a4528,0.45));
const sun=new THREE.DirectionalLight(0xfff2de,1.35);
sun.position.set(7,4.6,-3.5);sun.target.position.set(-1,0,-5.5);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:0.5,far:25});sun.shadow.bias=-0.0006;sun.shadow.normalBias=0.02;
scene.add(sun,sun.target);
const fill=new THREE.PointLight(0xffe2b8,0.25,9,2);fill.position.set(0,2.4,-1);scene.add(fill);

/* ---- shared materials ---- */
const ROOM={x:3.4,zBack:-11,zFront:2,h:2.9};
const RL=ROOM.zFront-ROOM.zBack, RZ=(ROOM.zFront+ROOM.zBack)/2;
function box(w,h,d,mat,x,y,z,parent){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(parent||scene).add(m);return m;}
function cyl(rt,rb,h,mat,x,y,z,parent,seg){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||16),mat);m.position.set(x,y,z);m.castShadow=true;(parent||scene).add(m);return m;}
const whiteMat=new THREE.MeshStandardMaterial({color:0xf3f1ee,roughness:.55});
const wallWhite=new THREE.MeshStandardMaterial({color:0xece6e0,roughness:.92});
const graphite=new THREE.MeshStandardMaterial({color:0x3a3a3d,roughness:.8});
const black=new THREE.MeshStandardMaterial({color:0x0e0e0f,roughness:.55});
const chrome=new THREE.MeshStandardMaterial({color:0xe4e4e4,metalness:1,roughness:.16});
const frameWhite=new THREE.MeshStandardMaterial({color:0xf6f6f4,roughness:.35,metalness:.1});

function grain(g,w,h,base,dark,light,n,vertical){
  g.fillStyle=base;g.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){g.strokeStyle=Math.random()<.65?dark.replace('A',rnd(.04,.16).toFixed(2)):light.replace('A',rnd(.05,.14).toFixed(2));g.lineWidth=rnd(.6,2.6);
    g.beginPath();const o=Math.random()*(vertical?w:h),a=rnd(2,9),f=rnd(.002,.01),ph=rnd(0,6);
    if(vertical){for(let y=0;y<=h;y+=12){const x=o+Math.sin(y*f+ph)*a;y?g.lineTo(x,y):g.moveTo(x,y);}}
    else{for(let x=0;x<=w;x+=12){const y=o+Math.sin(x*f+ph)*a;x?g.lineTo(x,y):g.moveTo(x,y);}}g.stroke();}
}
// walnut desk tops
const walnutTex=tex(512,256,(g,w,h)=>grain(g,w,h,'#8a5a34','rgba(55,30,12,A)','rgba(200,150,100,A)',160,false));
const walnut=new THREE.MeshStandardMaterial({map:walnutTex,roughness:.5});
// oak soffit
const oakTex=tex(512,256,(g,w,h)=>grain(g,w,h,'#c4925a','rgba(110,65,28,A)','rgba(245,205,150,A)',140,false),[6,1]);
const oak=new THREE.MeshStandardMaterial({map:oakTex,roughness:.6});

/* ---- walnut plank floor ---- */
const floorTex=tex(1024,1024,(g,w,h)=>{
  const cols=8,cw=w/cols;
  for(let c=0;c<cols;c++){let y=-rnd(0,h*0.9);
    while(y<h){const ph=rnd(h*0.6,h*1.0);const l=rnd(31,37),s=rnd(38,46),hue=rnd(22,26);
      g.fillStyle=`hsl(${hue},${s}%,${l}%)`;g.fillRect(c*cw,y,cw,ph);
      g.save();g.beginPath();g.rect(c*cw,y,cw,ph);g.clip();
      for(let i=0;i<26;i++){g.strokeStyle=`rgba(${Math.random()<.6?'60,30,12':'210,150,95'},${rnd(.05,.18)})`;g.lineWidth=rnd(.6,2.2);g.beginPath();
        const x0=c*cw+rnd(0,cw),a=rnd(1,5),f=rnd(.004,.02),p=rnd(0,6);for(let yy=y;yy<=y+ph;yy+=10){const xx=x0+Math.sin(yy*f+p)*a;yy===y?g.moveTo(xx,yy):g.lineTo(xx,yy);}g.stroke();}
      g.restore();g.fillStyle='rgba(30,15,6,.55)';g.fillRect(c*cw,y,cw,2);y+=ph;}
    g.fillStyle='rgba(30,15,6,.5)';g.fillRect(c*cw,0,2,h);}
},[5,3]);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(ROOM.x*2,RL),new THREE.MeshStandardMaterial({map:floorTex,roughness:.42,envMapIntensity:.6}));
floor.rotation.x=-Math.PI/2;floor.position.set(0,0,RZ);floor.receiveShadow=true;scene.add(floor);

/* ---- left wall: oak panels with black slat inlays and diagonal grooves ---- */
const PX=150; // px per metre
const woodWallTex=tex(Math.round(RL*PX),Math.round(2.78*PX),(g,w,h)=>{
  grain(g,w,h,'#c99863','rgba(115,70,30,A)','rgba(250,215,165,A)',900,true);
  // panel seams

function loadBin(done){

    const m=gltf.scene;m.updateMatrixWorld(true);

    const wrap=new THREE.Group();m.position.set(-c.x,-box3.min.y,-c.z);wrap.add(m);wrap.updateMatrixWorld(true);
    const H=box3.max.y-box3.min.y;let Rt=0,Rb=0;const v=new THREE.Vector3();
    m.traverse(o=>{if(o.isMesh){o.castShadow=o.receiveShadow=true;
      const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(mt=>{mt.transparent=true;mt.alphaTest=0.02;mt.depthWrite=false;mt.side=THREE.DoubleSide;});
      const p=o.geometry.attributes.position;for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);v.x-=c.x;v.z-=c.z;const y=v.y-box3.min.y,r=Math.hypot(v.x,v.z);
        if(y>H*0.93)Rt=Math.max(Rt,r);if(y<H*0.06)Rb=Math.max(Rb,r);}}});
    BIN0={H,Rt:Rt||0.134,Rb:Rb||Rt*0.85};

/* ================= physics ================= */
const tmp=new THREE.Vector3();
function stepBall(b,dt,binDX){
  const B=game.bin;
  b.v.y-=G*dt;
  const sp=b.v.length();b.v.addScaledVector(b.v,-DRAG*sp*dt);
  if(!b.inside)b.v.x+=game.wind*dt;
  if(b.inside)b.p.x+=binDX;
  b.p.addScaledVector(b.v,dt);
  // bin-relative coords
  const rx=b.p.x-B.x, rz=b.p.z-B.z, ry=b.p.y-B.y;
  let d=Math.hypot(rx,rz);const nx=d>1e-6?rx/d:1, nz=d>1e-6?rz/d:0;
  if(ry>=B.H)b.inside=d<B.Rt;
  // rim (torus)
  const RIM=0.008;
  const cx=nx*B.Rt, cz=nz*B.Rt;
  let dx=rx-cx, dy=ry-B.H, dz=rz-cz;const dist=Math.hypot(dx,dy,dz);
  if(dist<BALL_R+RIM&&dist>1e-6){
    dx/=dist;dy/=dist;dz/=dist;const pen=BALL_R+RIM-dist;
    b.p.x+=dx*pen;b.p.y+=dy*pen;b.p.z+=dz*pen;
    const vn=b.v.x*dx+b.v.y*dy+b.v.z*dz;
    if(vn<0){b.v.x-=1.45*vn*dx;b.v.y-=1.45*vn*dy;b.v.z-=1.45*vn*dz;b.v.multiplyScalar(0.88);
      if(-vn>0.4&&b.t-b.lastRim>0.12){sfx.rim(-vn);b.lastRim=b.t;}
      b.rim=true;b.spin.set(rnd(-20,20),rnd(-20,20),rnd(-20,20));}
  }
  // walls (cone)
  const ry2=b.p.y-B.y;
  if(ry2<B.H&&ry2>-BALL_R){
    const w=B.Rb+(B.Rt-B.Rb)*Math.min(1,Math.max(0,ry2/B.H));
    d=Math.hypot(b.p.x-B.x,b.p.z-B.z);
    if(b.inside){
      if(d>w-BALL_R){const nd=w-BALL_R;b.p.x=B.x+nx*nd;b.p.z=B.z+nz*nd;const vn=b.v.x*nx+b.v.z*nz;if(vn>0){b.v.x-=1.3*vn*nx;b.v.z-=1.3*vn*nz;}}
    }else if(d<w+BALL_R){
      const nd=w+BALL_R;b.p.x=B.x+nx*nd;b.p.z=B.z+nz*nd;const vn=b.v.x*nx+b.v.z*nz;
      if(vn<0){b.v.x-=1.35*vn*nx;b.v.z-=1.35*vn*nz;if(-vn>0.6&&b.t-b.lastRim>0.15){sfx.thud(-vn*0.6);b.lastRim=b.t;}b.rim=true;}
    }
  }
  // inside bottom
  if(b.inside&&b.p.y<B.y+BALL_R+0.004){
    b.p.y=B.y+BALL_R+0.004;if(b.v.y<0)b.v.y*=-0.22;b.v.x*=0.92;b.v.z*=0.92;
  }
  // scoring
  if(b.inside&&!b.scored&&b.p.y-B.y<B.H*0.62){b.scored=true;b.scoredT=b.t;onScore(b);}
  // floor
  if(!b.inside&&b.p.y<BALL_R){
    b.p.y=BALL_R;
    if(b.v.y<-0.6&&!b.floorHit){sfx.thud(-b.v.y);}
    if(b.v.y<0){b.v.y*=-0.3;b.floorHit=true;}
    b.v.x*=0.94;b.v.z*=0.94;b.spin.multiplyScalar(0.96);
  }
  // room walls
  if(b.p.x<-ROOM.x+BALL_R){b.p.x=-ROOM.x+BALL_R;b.v.x*=-0.4;}
  if(b.p.x>ROOM.x-BALL_R){b.p.x=ROOM.x-BALL_R;b.v.x*=-0.4;}
  if(b.p.z<ROOM.zBack+BALL_R){b.p.z=ROOM.zBack+BALL_R;b.v.z*=-0.4;}
  if(b.p.y>ROOM.h-BALL_R){b.p.y=ROOM.h-BALL_R;b.v.y*=-0.3;}
}

let drag=null;
function refLen(){return Math.min(window.innerHeight*0.62,560);}
canvas.addEventListener('pointerdown',e=>{
  if(game.state!=='aim'||ball.state!=='hand')return;
  ac();drag={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  sfx.crumple();
});
canvas.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){drag.x=e.clientX;drag.y=e.clientY;}});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const dx=drag.x-drag.x0, dy=drag.y-drag.y0;drag=null;
  if(dy>-25||game.state!=='aim'||ball.state!=='hand')return;
  const s=Math.min(1.1,-dy/refLen());
  const speed=2.6+8.4*s;
  const yaw=Math.atan2(dx,-dy)*0.55;
  throwBall(speed,yaw);
}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id)drag=null;});

function throwBall(speed,yaw){
  ball.state='fly';ball.t=0;
  ball.v.set(Math.sin(yaw)*Math.cos(PITCH)*speed,Math.sin(PITCH)*speed,-Math.cos(yaw)*Math.cos(PITCH)*speed);
  ball.spin.set(rnd(-12,-4),rnd(-4,4),rnd(-4,4));
  game.throwsLeft--;game.state='flying';sfx.whoosh();
  $('hint').hidden=true;
  if(trail){scene.remove(trail);trail=null;}trailPts=[ball.p.clone()];
  updateHUD();
}

function onScore(b){
  game.hits++;game.streak++;
  const swish=!b.rim;
  const L=game.level;
  const mult=Math.min(3,1+0.5*(game.streak-1));
  const pts=Math.round((100+(swish?50:0))*(1+L*0.2)*mult/10)*10;
  game.score+=pts;
  game.results.push(1);
  sfx.paper();if(swish)setTimeout(sfx.swish,80);
  const word=swish?'Swish!':['Treffer!','Drin!','Sauber!','Volltreffer!'][Math.floor(Math.random()*4)];
  let sub='+'+pts;if(game.streak>1)sub+=`  ·  Serie ×${mult.toFixed(1).replace('.0','')}`;
  if(game.hits===levelDef(L).need&&!game.targetHit){game.targetHit=true;sub+='\nZiel erreicht – Rest ist Bonus';}
  toast(word,sub);
  if(game.score>best){best=game.score;store.set('best',best);}
  updateHUD();
}
function onMiss(){
  game.streak=0;game.results.push(0);
  toast(ball.rim?'Knapp!':['Daneben','Vorbei','Oops'][Math.floor(Math.random()*3)],ball.rim?'Am Rand abgeprallt':'');
  updateHUD();
}
function finishThrow(scored){
  // store trail of this throw
  if(trailPts.length>2){
    const g=new THREE.BufferGeometry().setFromPoints(trailPts);
    trail=new THREE.Line(g,new THREE.LineDashedMaterial({color:0xffffff,dashSize:0.06,gapSize:0.07,transparent:true,opacity:0.45}));trail.computeLineDistances();scene.add(trail);
  }
  if(scored){
    const B=game.bin;const m=ball.mesh;binG.worldToLocal(m.position);binG.add(m);binBalls.push(m);
  }else{
    floorBalls.push(ball.mesh);if(floorBalls.length>14)scene.remove(floorBalls.shift());
  }
  ball=null;game.state='between';
  const L=levelDef(game.level);
  setTimeout(()=>{
    if(game.hits+game.throwsLeft<L.need){levelFailed();return;}
    if(game.throwsLeft<=0){levelDone();return;}
    newWind();spawnBall();game.state='aim';
  },650);
}

/* ================= memos ================= */
function stars(n){return '<span class="stars">'+[0,1,2].map(i=>i<n?'★':'<span class="off">★</span>').join('')+'</span>';}
function memo({to,subject,big,body,stamp,stampGreen,actions,credit}){
  const m=$('menu');
  const today=new Date().toLocaleDateString('de-CH');
  m.innerHTML=`<div class="memo" role="dialog" aria-modal="true" aria-label="${subject}">
    <h1>INTERNES MEMO</h1>
    <div class="meta"><span>An:</span><span>${to}</span><span>Von:</span><span>Personalabteilung</span><span>Datum:</span><span>${today}</span><span>Betreff:</span><span>${subject}</span></div>
    ${stamp?`<div class="stamp${stampGreen?' green':''}">${stamp}</div>`:''}
    <div class="big">${big}</div>${body}
    <div class="actions">${actions.map((a,i)=>`<button class="btn${a.ghost?' ghost':''}" id="act${i}">${a.label}</button>`).join('')}</div>
    ${credit?`<div class="credit">Papierkorb-Modell: „Trash Can“ von <a href="https://sketchfab.com/3d-models/trash-can-a65eb3a1b6f149d7a78f7f44e80c7627" target="_blank" rel="noopener">rickmaolly</a>, Lizenz <a href="http://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>.<div id="loading"></div></div>`:''}
  </div>`;
  m.hidden=false;$('hud').hidden=true;
  actions.forEach((a,i)=>$('act'+i).addEventListener('click',()=>{ac();a.go();}));
  setTimeout(()=>{const b=$('act0');if(b)b.focus({preventScroll:true});},50);
  if(stamp)setTimeout(sfx.stamp,300);
}
function hideMemo(){$('menu').hidden=true;$('hud').hidden=false;}
function nextInfo(i){const L=levelDef(i);const bits=[`${L.d.toFixed(1)} m Distanz`,`Kübel ${Math.round(L.s/1.6*100)} %`];
  bits.push(L.w>0?`Wind bis ${L.w.toFixed(1)}`:'kein Wind');if(L.m>0)bits.push('Kübel fährt auf Saugroboter');bits.push(`${L.need} von ${THROWS} Treffern nötig`);
  return '<div class="facts">'+bits.map(b=>`<span>· ${b}</span>`).join('')+'</div>';}

function showStart(){
  game.state='menu';
  const acts=[{label:'Erster Arbeitstag →',go:()=>{hideMemo();game.score=0;game.levelStartScore=0;startLevel(0,true);}}];
  if(bestLevel>0)acts.push({label:`Weiter bei Stufe ${bestLevel+1}`,ghost:true,go:()=>{hideMemo();game.score=0;game.levelStartScore=0;startLevel(bestLevel,true);}});
  memo({to:'Alle Mitarbeitenden',subject:'Papierkorb-Offensive',big:'Paper Toast',
    body:`<p>Ab sofort gilt: Wer den Papierkorb trifft, wird befördert. Pro Stufe hast du ${THROWS} Würfe. Je höher du kommst, desto weiter weg steht der Kübel, desto kleiner wird er – und der Ventilator hilft auch nicht.</p>
      <p class="hand">↑ Nach oben wischen = werfen. Länger wischen = weiter. Schräg wischen = zielen.</p>
      ${best>0?`<p>Dein Rekord: <b>${best.toLocaleString('de-CH')}</b> Punkte · höchste Stufe: ${levelDef(bestLevel).t}</p>`:''}`,
    actions:acts,credit:true});
}
function levelDone(){
  const L=levelDef(game.level),need=L.need,h=game.hits;
  const st=h>=need+4||h===THROWS?3:h>=need+2?2:1;
  const bonus=st*100*(game.level+1);game.score+=bonus;
  if(game.score>best){best=game.score;store.set('best',best);}
  const next=game.level+1;if(next>bestLevel){bestLevel=next;store.set('bestLevel',bestLevel);}
  sfx.win();
  memo({to:'Dich',subject:'Beförderung',stamp:'BEFÖRDERT',stampGreen:true,big:levelDef(next).t,
    body:`<p>${h} von ${THROWS} Treffern ${stars(st)} &nbsp;Bonus +${bonus}</p><p>Stand: <b>${game.score.toLocaleString('de-CH')}</b> Punkte. Deine neue Position:</p>${nextInfo(next)}`,
    actions:[{label:'Neuen Job antreten →',go:()=>{hideMemo();startLevel(next,true);}}]});
}
function levelFailed(){
  const L=levelDef(game.level);
  sfx.fail();
  memo({to:'Dich',subject:'Leistungsbeurteilung',stamp:'ABGELEHNT',big:'Nochmal!',
    body:`<p>${game.hits} von ${L.need} nötigen Treffern in der Stufe „${L.t}“. Die Personalabteilung gibt dir eine zweite Chance.</p>${nextInfo(game.level)}`,
    actions:[{label:'Nochmal versuchen',go:()=>{hideMemo();startLevel(game.level,false);}},{label:'Zum Start',ghost:true,go:()=>{showStart();}}]});
}

/* ================= mute ================= */
function renderMute(){$('muteWave').toggleAttribute('hidden',muted);$('muteX').toggleAttribute('hidden',!muted);$('mute').setAttribute('aria-label',muted?'Ton an':'Ton aus');}
$('mute').addEventListener('click',()=>{muted=!muted;store.set('muted',muted);renderMute();if(!muted){ac();sfx.paper();}});
renderMute();

/* ================= main loop ================= */
let last=performance.now(),acc=0;const STEP=1/480;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;game.t+=dt;
  const t=game.t;
  // bin motion
  const oldX=game.bin.x;updateBin(t);const binDX=game.bin.x-oldX;
  // ball
  if(ball){
    if(ball.state==='hand'){
      const pull=drag?Math.min(1,Math.max(0,-(drag.y-drag.y0)/refLen())):0;
      ball.p.set(HAND.x+(drag?(drag.x-drag.x0)/refLen()*0.08:0),HAND.y+Math.sin(t*2.2)*0.006-pull*0.06,HAND.z+pull*0.08);
      ball.mesh.position.copy(ball.p);ball.mesh.rotation.y+=dt*0.3;
    }else if(ball.state==='fly'){
      const n=Math.max(1,Math.round(dt/STEP));const h=dt/n;
      for(let i=0;i<n;i++){ball.t+=h;stepBall(ball,h,binDX/n);}
      ball.mesh.position.copy(ball.p);
      const sp=ball.v.length();ball.mesh.rotation.x+=ball.spin.x*dt*Math.min(1,sp/3);ball.mesh.rotation.y+=ball.spin.y*dt*Math.min(1,sp/3);ball.mesh.rotation.z+=ball.spin.z*dt*Math.min(1,sp/3);
      if(!ball.scored&&trailPts.length<400&&trailPts[trailPts.length-1].distanceToSquared(ball.p)>0.01)trailPts.push(ball.p.clone());
      if(ball.scored){if(ball.t-ball.scoredT>1.0||(sp<0.08&&ball.t-ball.scoredT>0.3))finishThrow(true);}
      else{
        const onFloor=ball.p.y<=BALL_R+0.002;
        if((onFloor&&sp<0.25)||ball.t>4.5||(ball.floorHit&&ball.t>2.4)){onMiss();finishThrow(false);}
      }
    }
  }
  // fans + wind streaks
  const w=game.wind;
  fans.forEach(f=>{const active=(w>0&&f.side<0)||(w<0&&f.side>0);const target=active?Math.abs(w)*14:0;f.spin+=(target-f.spin)*Math.min(1,dt*2);f.blades.rotation.z+=f.spin*dt;
    f.head.rotation.y=Math.sin(t*0.6+f.side)*0.08;});
  streakMat.opacity+=((Math.min(0.35,Math.abs(w)*0.12))-streakMat.opacity)*Math.min(1,dt*3);
  if(streakMat.opacity>0.005){for(let i=0;i<STREAKS;i++){const s=streakData[i];s.x+=w*s.s*dt*0.9;
      if(s.x>3.2){s.x=-3.2;s.y=rnd(.4,2.2);s.z=rnd(Math.max(-9.5,game.bin.z-1),-0.5);}if(s.x<-3.2){s.x=3.2;s.y=rnd(.4,2.2);s.z=rnd(Math.max(-9.5,game.bin.z-1),-0.5);}
      const dir=Math.sign(w)||1;streakPos.set([s.x,s.y,s.z,s.x-dir*s.l,s.y,s.z],i*6);}
    streakGeo.attributes.position.needsUpdate=true;}
  streaks.visible=streakMat.opacity>0.005;
  // menu idle camera drift
  if(game.state==='menu'){camera.position.set(CAM.x+Math.sin(t*0.25)*0.25,CAM.y+0.05,CAM.z);camera.lookAt(0,0.75,game.bin.z);}
  else{camera.position.copy(CAM);camera.lookAt(0,0.75,game.bin.z);}
  renderer.render(scene,camera);
  drawAim();
}
function drawAim(){
  const w=window.innerWidth,h=window.innerHeight;actx.clearRect(0,0,w,h);
  if(!drag)return;
  const dx=drag.x-drag.x0,dy=drag.y-drag.y0;if(dy>-8)return;
  const s=Math.min(1.1,-dy/refLen());
  const col=s<0.45?'#7fd18b':s<0.75?'#ffd34d':'#ff7a59';
  actx.lineCap='round';actx.setLineDash([2,10]);actx.lineWidth=5;actx.strokeStyle='rgba(255,255,255,.85)';
  actx.beginPath();actx.moveTo(drag.x0,drag.y0);actx.lineTo(drag.x,drag.y);actx.stroke();actx.setLineDash([]);
  actx.fillStyle=col;actx.beginPath();actx.arc(drag.x,drag.y,9,0,7);actx.fill();
  actx.strokeStyle='rgba(0,0,0,.35)';actx.lineWidth=2;actx.stroke();
  // power gauge
  const gx=Math.min(w-40,drag.x0+46),gy=drag.y0,gh=110;
  actx.fillStyle='rgba(253,253,251,.85)';actx.fillRect(gx,gy-gh,10,gh);
  actx.fillStyle=col;actx.fillRect(gx,gy-gh*Math.min(1,s/1.1),10,gh*Math.min(1,s/1.1));
  actx.strokeStyle='#1d2742';actx.lineWidth=1.5;actx.strokeRect(gx,gy-gh,10,gh);
  actx.font='700 22px Caveat, cursive';actx.fillStyle='#fff';actx.shadowColor='rgba(0,0,0,.6)';actx.shadowBlur=6;
  actx.fillText(Math.round(s/1.1*100)+' %',gx+16,gy-gh*Math.min(1,s/1.1)+8);actx.shadowBlur=0;
}

/* ================= boot ================= */
game.bin.z=-3;resize();
showStart();
const ld=$('loading');if(ld)ld.textContent='Papierkorb wird geliefert …';
loadBin(()=>{
  const L=levelDef(0),b=game.bin;b.s=L.s;b.H=BIN0.H*L.s;b.Rt=BIN0.Rt*L.s;b.Rb=BIN0.Rb*L.s;binHolder.scale.setScalar(L.s);updateBin(0);
  const l=$('loading');if(l)l.textContent='';
});
requestAnimationFrame(frame);
window.__paperToast={game,throwBall:(s,y)=>throwBall(s,y),get ball(){return ball;},BIN0:()=>BIN0,startLevel};
})();
</script>
</body>
