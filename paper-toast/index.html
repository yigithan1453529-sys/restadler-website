<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Toast</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Special+Elite&display=swap">
<style>
/* Layout: full-bleed 3D office; HUD = sticky notes stuck to the screen corners; menus = typed internal memos with a rubber stamp */
:root{
  --ink:#1d2742;        /* ballpoint blue-black */
  --paper:#fdfdfb;      /* copier paper */
  --rule:#cfdcf2;       /* ruled lines */
  --sticky:#ffe45c;     /* post-it yellow */
  --sticky-dark:#e8c935;
  --stamp:#c8102e;      /* rubber stamp red */
  --ok:#1f7a4d;         /* green check */
  --scrim:rgba(18,22,36,.55);
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --type:"Special Elite","Courier New",Courier,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#2b2f3a;color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage canvas:active{cursor:grabbing}
#aim{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}

/* ---------- sticky-note HUD ---------- */
.note{position:fixed;background:var(--sticky);color:var(--ink);font-family:var(--hand);padding:10px 14px 12px;box-shadow:0 1px 0 var(--sticky-dark) inset,0 8px 16px -6px rgba(0,0,0,.45);line-height:1.05;pointer-events:none}
.note::before{content:"";position:absolute;left:50%;top:-8px;width:54px;height:16px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#noteLevel{top:calc(10px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));transform:rotate(-2deg);min-width:150px}
#noteScore{top:calc(10px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));transform:rotate(2.2deg);text-align:right;min-width:96px}
.n-small{font-size:17px;opacity:.8}
.n-big{font-size:28px;font-weight:700}
.n-row{font-size:21px;margin-top:2px}
#hScore{font-variant-numeric:tabular-nums}
.balls{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;max-width:170px}
.balls i{width:12px;height:12px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);box-sizing:border-box;display:block}
.balls i.hit{background:var(--ok);border-color:var(--ok)}
.balls i.miss{background:transparent;border-color:rgba(29,39,66,.35);position:relative}
.balls i.miss::after{content:"";position:absolute;inset:4px -1px;border-top:1.5px solid rgba(29,39,66,.55);transform:rotate(45deg)}

#wind{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(253,253,251,.92);color:var(--ink);padding:6px 14px;border-radius:999px;font-family:var(--type);font-size:14px;letter-spacing:.04em;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;white-space:nowrap}
#wind svg{width:34px;height:14px;transition:transform .3s}
#wind b{font-variant-numeric:tabular-nums;font-weight:400;min-width:2.4em;text-align:left}

#mute{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(253,253,251,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#radioBtn{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 54px);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:rgba(253,253,251,.9);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.25)}
#radioBtn svg{width:22px;height:22px}
#radioBtn.off{opacity:.45}
#radioBtn:focus-visible,#mute:focus-visible,.btn:focus-visible{outline:3px solid var(--stamp);outline-offset:3px}
#mute svg{width:22px;height:22px}

#hint{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-family:var(--hand);font-size:26px;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}

#toast{position:fixed;left:50%;top:34%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;font-family:var(--hand);color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.55);opacity:0}
#toast .t1{font-size:clamp(44px,9vw,76px);font-weight:700;line-height:1}
#toast .t2{font-size:clamp(22px,4.5vw,32px)}
#toast.show{animation:pop 1.25s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}25%{transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}

#turn{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--paper);color:var(--ink);padding:5px 16px 7px;border-radius:999px;font-family:var(--hand);font-size:24px;font-weight:700;box-shadow:0 4px 12px rgba(0,0,0,.3);pointer-events:none;white-space:nowrap;max-width:calc(100vw - 32px)}
#turn i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--ink);display:block}
#turn.pulse{animation:turnpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes turnpop{from{transform:translateX(-50%) scale(.6);opacity:0}}
.board{list-style:none;margin:0;padding:0;display:grid;gap:3px;min-width:150px;text-align:left}
.board li{display:grid;grid-template-columns:12px 1fr auto;align-items:center;gap:7px;font-size:20px;line-height:1.05}
.board li i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.board li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}
.board li b{font-variant-numeric:tabular-nums}
.board li small{grid-column:2/4;font-size:14px;opacity:.7;margin-top:-3px}
.board li.cur{font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.board li.out{opacity:.45;text-decoration:line-through}
/* power meter: fixed on the right edge, away from the finger */
#power{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translate(14px,-50%);width:46px;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
#power.on{opacity:1;transform:translate(0,-50%)}
#powerTrack{position:relative;width:26px;height:min(40vh,300px);background:rgba(253,253,251,.92);border:2px solid var(--ink);border-radius:15px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35)}
#powerTrack::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 calc(10% - 1px),rgba(29,39,66,.25) calc(10% - 1px) 10%)}
#powerFill{position:absolute;left:0;right:0;bottom:0;height:0;background:#3fb35a}
#powerPct{font-family:var(--hand);font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.7);font-variant-numeric:tabular-nums;white-space:nowrap}
#powerLbl{font-family:var(--type);font-size:10px;letter-spacing:.2em;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8)}
/* ---------- memo overlays ---------- */
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:var(--scrim);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;box-sizing:border-box}
.memo{position:relative;width:min(520px,100%);box-sizing:border-box;background:var(--paper);color:var(--ink);padding:26px 28px 24px;transform:rotate(-.6deg);box-shadow:0 22px 50px -12px rgba(0,0,0,.6);background-image:repeating-linear-gradient(to bottom,transparent 0 27px,var(--rule) 27px 28px);background-position:0 120px;animation:slide .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes slide{from{transform:translateY(40px) rotate(-3deg);opacity:0}}
.memo h1{font-family:var(--type);font-weight:400;font-size:13px;letter-spacing:.32em;margin:0 0 14px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.meta{font-family:var(--type);font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin-bottom:16px}
.meta span:nth-child(odd){opacity:.6}
.memo .big{font-family:var(--hand);font-size:clamp(46px,11vw,68px);font-weight:700;line-height:.95;margin:4px 0 10px;text-wrap:balance}
.memo p{font-size:15.5px;line-height:28px;margin:0 0 0;max-width:62ch}
.memo .hand{font-family:var(--hand);font-size:22px;line-height:28px}
.memo .stars{font-size:30px;letter-spacing:4px;color:#e2a400;line-height:28px}
.memo .stars .off{color:#d6d6d6}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-family:var(--type);font-size:13px;margin:6px 0 4px}
.facts span{white-space:nowrap}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{font-family:var(--hand);font-size:25px;font-weight:700;border:2px solid var(--ink);background:var(--sticky);color:var(--ink);padding:6px 20px 8px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.stamp{position:absolute;right:20px;top:62px;font-family:var(--type);font-size:24px;letter-spacing:.12em;color:var(--stamp);border:3px solid var(--stamp);padding:4px 10px;transform:rotate(-12deg);opacity:.85;mix-blend-mode:multiply;animation:stamp .35s .25s both cubic-bezier(.3,1.6,.5,1)}
.stamp.green{color:var(--ok);border-color:var(--ok)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 10px}
.chip{font-family:var(--hand);font-size:22px;font-weight:700;padding:3px 16px 5px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.chip:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.pname{display:flex;align-items:center;gap:8px;min-width:0}
.pname i{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink)}
.pname input,.invite input{min-width:0;width:100%;font-family:var(--hand);font-size:22px;color:var(--ink);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:2px 2px;outline:none}
.pname input:focus,.invite input:focus{border-bottom-color:var(--stamp)}
.pname.solo{display:grid;gap:2px;margin-top:10px;max-width:280px}
.pname.solo span{font-family:var(--type);font-size:12px;letter-spacing:.12em;opacity:.7}
.invite{display:flex;gap:10px;align-items:center;margin-top:12px}
.invite input{font-family:var(--type);font-size:13px}
.btn.small{font-size:20px;padding:3px 14px 5px;flex:none}
.btn[disabled]{opacity:.45;cursor:default}
.rank{list-style:none;padding:0;margin:12px 0 4px;display:grid;gap:4px}
.rank li{display:grid;grid-template-columns:14px 1fr auto;align-items:center;gap:10px;font-family:var(--hand);font-size:23px;line-height:28px}
.rank li i{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.rank li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank li.out{opacity:.5}
.credit{font-size:11.5px;line-height:1.5;margin-top:18px;opacity:.6}
.credit a{color:inherit}
#loading{font-family:var(--type);font-size:13px;opacity:.7;margin-top:10px}
@media (max-width:480px){
  .names{grid-template-columns:1fr}
  #turn{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));font-size:21px}
  #powerTrack{height:min(34vh,240px)}
  .memo{padding:22px 18px 20px}
  .note{padding:8px 11px 10px}
  .n-big{font-size:23px}.n-row{font-size:19px}.n-small{font-size:15px}
  #noteLevel{min-width:0}
  #wind{top:auto;bottom:calc(20px + env(safe-area-inset-bottom,0px));font-size:12px}
  #hint{bottom:calc(70px + env(safe-area-inset-bottom,0px));font-size:22px}
  .stamp{font-size:18px;top:56px;right:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* ---------- stars, rewards, tasks, kiosk, ad placeholder ---------- */
.wallet{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--hand);font-size:24px;margin:2px 0 6px}
.wallet b{font-size:28px}
.wallet .st{color:#c98a00}
.sect{font-family:var(--type);font-size:12.5px;letter-spacing:.2em;margin:14px 0 4px;border-bottom:1.5px solid var(--ink);padding-bottom:3px}
.ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 2px}
.ladder button{font-family:var(--hand);font-size:19px;line-height:1.05;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 2px;cursor:pointer;min-height:64px;box-shadow:2px 2px 0 var(--ink)}
.ladder button b{display:block;font-size:24px;color:#c98a00}
.ladder button.done{background:#e3f1e8;color:#5b7;box-shadow:none;cursor:default}
.ladder button.done b{color:#5b7}
.ladder button.next{background:var(--sticky)}
.rank li:has(.gift){grid-template-columns:14px 1fr auto auto}
.rank .gift{margin-left:0;font-size:17px;padding:1px 10px 3px}
.ladder button:disabled:not(.done){opacity:.45;cursor:default;box-shadow:none}
.tasks{list-style:none;margin:0;padding:0}
.tasks li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--rule)}
.tasks .tt{font-size:15px;line-height:20px}
.tasks .bar{grid-column:1;height:6px;background:#e4e4e4;border-radius:3px;overflow:hidden}
.tasks .bar i{display:block;height:100%;background:var(--ok)}
.tasks .rw{grid-row:1/3;grid-column:2;font-family:var(--hand);font-size:20px}
.tasks .rw.ok{color:var(--ok)}
.shop{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.shop li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border:2px solid var(--ink);padding:8px 10px;background:#fff}
.shop .pk{font-family:var(--hand);font-size:26px;font-weight:700;color:#c98a00}
.shop .pr{font-size:14px}
#ad{position:fixed;inset:0;z-index:50;background:#111;color:#eee;display:grid;place-items:center;font-family:var(--sans);padding:20px;box-sizing:border-box}
#ad .box{width:min(560px,100%);aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#2a2a2a 0 18px,#333 18px 36px);border:2px dashed #777;display:grid;place-items:center;text-align:center;padding:16px;box-sizing:border-box}
#ad .box b{display:block;font-size:13px;letter-spacing:.25em;color:#aaa;margin-bottom:8px}
#ad .box span{font-size:20px}
#ad .cd{margin-top:14px;font-size:15px;color:#bbb;text-align:center}
#ad .btn{margin-top:14px}
#taskNote{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) rotate(-1deg);background:var(--sticky);color:var(--ink);font-family:var(--hand);font-size:22px;padding:6px 16px 8px;box-shadow:0 8px 16px -6px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:opacity .3s;z-index:20;white-space:nowrap}
#taskNote.show{opacity:1}
</style>
</head>
<body>

<div id="stage"></div>
<canvas id="aim"></canvas>

<div id="hud" hidden>
  <div class="note" id="noteLevel">
    <div class="n-small">Stufe <span id="hLevel">1</span></div>
    <div class="n-big" id="hTitle">Praktikum</div>
    <div class="n-row">Treffer <span id="hHits">0</span> / <span id="hNeed">3</span></div>
    <div class="balls" id="hBalls"></div>
  </div>
  <div class="note" id="noteScore">
    <div id="hSolo"><div class="n-small">Punkte</div>
    <div class="n-big" id="hScore">0</div>
    <div class="n-small">Rekord <span id="hBest">0</span></div></div>
    <ol class="board" id="hBoard" hidden></ol>
  </div>
  <div id="wind" aria-live="polite">WIND
    <svg viewBox="0 0 34 14" aria-hidden="true"><path d="M2 7h26M22 2l7 5-7 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <b id="hWind">0.0</b>
  </div>
</div>
<div id="turn" hidden><i id="turnDot"></i><span id="turnName"></span> ist dran</div>
<div id="power" role="meter" aria-label="Wurfkraft" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="powerTrack"><div id="powerFill"></div></div><div id="powerPct">0 %</div><div id="powerLbl">KRAFT</div></div>
<div id="hint" hidden>↑ nach oben wischen &amp; loslassen</div>
<div id="toast"><div class="t1"></div><div class="t2"></div></div>
<div id="taskNote" aria-live="polite"></div>
<div id="ad" hidden role="dialog" aria-modal="true" aria-label="Werbung"><div><div class="box"><div><b>WERBUNG</b><span>Hier läuft später ein Werbevideo.</span></div></div><div class="cd" id="adCd"></div><div style="text-align:center"><button class="btn" id="adDone" hidden>Belohnung abholen →</button></div></div></div>
<button id="mute" aria-label="Ton aus" title="Ton an/aus">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path id="muteX" d="M17 9l5 6M22 9l-5 6" hidden/></svg>
</button>
<button id="radioBtn" aria-label="Radio an/aus" aria-pressed="true" title="Radio aus">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M7 8l9-5"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6.5 12.5h4M6.5 15.5h4"/></svg>
</button>
<div class="overlay" id="menu"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);

/* ================= levels ================= */
// d = distance (m), s = bin scale, w = max wind (m/s²), m = moving amplitude (m), need = hits of 10
// bar:true = bin stands on the standing table behind the conference table, otherwise on the table itself
const LEVELS=[
  // gentle start: the bin moves back slowly; the far standing table only comes in the top levels
  {t:'Praktikum',        d:3.2, s:1.60, w:0,   m:0,    need:3},
  {t:'Lehre',            d:3.5, s:1.55, w:0.4, m:0,    need:3},
  {t:'Sachbearbeitung',  d:3.8, s:1.50, w:0.7, m:0,    need:4},
  {t:'Teamleitung',      d:4.1, s:1.45, w:1.0, m:0,    need:4},
  {t:'Abteilungsleitung',d:4.4, s:1.35, w:0.9, m:0.3,  need:4},
  {t:'Bereichsleitung',  d:4.9, s:1.25, w:1.4, m:0,    need:4},
  {t:'Direktion',        d:5.4, s:1.15, w:1.6, m:0,    need:4},
  {t:'Vizepräsidium',    d:5.9, s:1.05, w:1.9, m:0.45, need:4},
  {t:'CEO',              d:7.15,s:1.00, w:1.8, m:0,    need:4, bar:true},
  {t:'Verwaltungsrat',   d:7.15,s:0.92, w:2.4, m:0,    need:5, bar:true},
];
function levelDef(i){
  if(i<LEVELS.length) return LEVELS[i];
  const k=i-LEVELS.length+1;
  return {t:'Legende '+['I','II','III','IV','V','VI','VII','VIII','IX','X'][Math.min(k-1,9)]+(k>10?'+':''),

function ac(){

function noise(dur,freq,q,gain,type,when){
  const a=ac();if(!a||muted)return;const t=a.currentTime+(when||0);
  const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=freq;f.Q.value=q;

  s.connect(f).connect(g).connect(a.destination);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}
function tone(freq,dur,gain,type,when,slide){
  const a=ac();if(!a||muted)return;const t=a.currentTime+(when||0);
  const o=a.createOscillator();o.type=type||'sine';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);

const radio={on:store.get('radio',true),started:false,out:null,music:null,talk:null,timer:0,next:0,step:0,song:null,songStart:0,speechT:0};
const SONGS=[
  {bpm:100,root:60,prog:[[0,4,7],[7,11,14],[9,12,16],[5,9,12]],scale:[0,2,4,7,9]},     // C  G  Am F
  {bpm:112,root:62,prog:[[0,4,7],[5,9,12],[7,11,14],[5,9,12]],scale:[0,2,4,7,9]},     // D  G  A  G
  {bpm:92, root:57,prog:[[0,3,7],[8,12,15],[3,7,10],[10,14,17]],scale:[0,3,5,7,10]},  // Am F  C  G
  {bpm:120,root:64,prog:[[0,4,7],[9,12,16],[5,9,12],[7,11,14]],scale:[0,2,4,7,9]},
];
const mtof=n=>440*Math.pow(2,(n-69)/12);
function radioInit(){
  const a=ac();if(!a||radio.out)return;
  radio.out=a.createGain();radio.out.gain.value=0;radio.out.connect(a.destination);
  // "speaker": band-limited and slightly crunchy
  const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=220;
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3800;
  const sh=a.createWaveShaper();const c=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;c[i]=Math.tanh(x*1.6);}sh.curve=c;
  radio.music=a.createGain();radio.music.gain.value=0.55;radio.music.connect(hp);hp.connect(lp);lp.connect(sh);
  const pan=a.createStereoPanner?a.createStereoPanner():null;if(pan){pan.pan.value=0.55;sh.connect(pan);pan.connect(radio.out);}else sh.connect(radio.out);
  // faint static
  const st=a.createBufferSource();st.buffer=noiseBuf;st.loop=true;const stf=a.createBiquadFilter();stf.type='bandpass';stf.frequency.value=2500;stf.Q.value=0.6;
  const stg=a.createGain();stg.gain.value=0.012;st.connect(stf).connect(stg).connect(radio.out);st.start();
  // colleagues: muffled, from the other side of the room
  radio.talk=a.createGain();radio.talk.gain.value=1;const tl=a.createBiquadFilter();tl.type='lowpass';tl.frequency.value=2200;radio.talk.connect(tl);tl.connect(radio.out);
  radio.song=SONGS[0];radio.next=a.currentTime+0.1;radio.songStart=a.currentTime;radio.step=0;
  radio.timer=setInterval(radioTick,60);
  voicesInit();
}
function radioApply(){
  const a=AC;if(!a||!radio.out)return;const v=(radio.on&&!muted&&!adOn)?0.11:0;
  radio.out.gain.setTargetAtTime(v,a.currentTime,0.25);
  if(!(radio.on&&!muted)&&window.speechSynthesis){try{speechSynthesis.cancel();}catch(e){}}
}
function rtone(f,t,dur,gain,type,dest,attack){
  const a=AC;const o=a.createOscillator();o.type=type;o.frequency.value=f;const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(gain,t+(attack||0.008));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(dest||radio.music);o.start(t);o.stop(t+dur+0.05);
}
function rnoise(t,dur,freq,type,gain){
  const a=AC;const s=a.createBufferSource();s.buffer=noiseBuf;const f=a.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=a.createGain();
  g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f).connect(g).connect(radio.music);s.start(t,Math.random()*0.5);s.stop(t+dur+0.02);
}
let melodySeed=1;const mrand=()=>{melodySeed=(melodySeed*16807)%2147483647;return melodySeed/2147483647;};
function radioTick(){
  const a=AC;if(!a||!radio.out)return;
  if(!(radio.on&&!muted)){radio.next=a.currentTime+0.1;return;}
  while(radio.next<a.currentTime+0.25){
    const S=radio.song,t=radio.next,s16=60/S.bpm/4,step=radio.step;
    const bar=Math.floor(step/16)%S.prog.length,pos=step%16,chord=S.prog[bar],root=S.root;
    // drums
    if(pos%8===0){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+0.12);g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);o.connect(g).connect(radio.music);o.start(t);o.stop(t+0.25);}
    if(pos===4||pos===12)rnoise(t,0.14,1800,'bandpass',0.35);
    if(pos%2===0)rnoise(t,0.04,7000,'highpass',pos%4===2?0.12:0.06);
    // bass
    if(pos===0||pos===6||pos===10)rtone(mtof(root-24+chord[0]),t,s16*3,0.35,'triangle');
    // keys: chord stabs on the off-beats
    if(pos===2||pos===6||pos===10||pos===14)chord.forEach(n=>rtone(mtof(root+n),t,s16*1.6,0.07,'triangle'));
    // melody
    if(pos%2===0){melodySeed=(Math.floor(step/32)*97+pos*13+S.root)|1;mrand();if(mrand()<0.62){const deg=S.scale[Math.floor(mrand()*S.scale.length)]+(mrand()<.3?12:0);
      rtone(mtof(root+12+deg),t,s16*(mrand()<.4?3:1.6),0.08,'square',null,0.01);}}
    radio.next+=s16;radio.step++;
    // a new song every ~70 s, with a station jingle
    if(radio.step%16===0&&t-radio.songStart>70){radio.songStart=t;radio.step=0;radio.song=SONGS[(SONGS.indexOf(S)+1)%SONGS.length];
      [72,76,79,84].forEach((n,i)=>rtone(mtof(n),t+0.3+i*0.14,0.5,0.12,'sine'));radio.next+=1.4;sayRadio();}
  }
}

const VOWELS=[[730,1090],[530,1840],[270,2290],[570,840],[300,870],[660,1720]];
const talkers=[{f0:118,pan:-0.7,busyUntil:0},{f0:205,pan:-0.2,busyUntil:0},{f0:150,pan:0.8,busyUntil:0}];

function speakPhrase(tk,t0){
  const a=AC;const syl=Math.floor(rnd(4,13));let t=t0;
  const src=a.createOscillator();src.type='sawtooth';
  const f1=a.createBiquadFilter(),f2=a.createBiquadFilter();f1.type=f2.type='bandpass';f1.Q.value=6;f2.Q.value=9;
  const g=a.createGain();g.gain.value=0.0001;const mix=a.createGain();mix.gain.value=0.9;
  const pan=a.createStereoPanner?a.createStereoPanner():null;
  src.connect(f1);src.connect(f2);f1.connect(g);f2.connect(g);g.connect(mix);
  if(pan){pan.pan.value=tk.pan;mix.connect(pan);pan.connect(radio.talk);}else mix.connect(radio.talk);
  const base=tk.f0*rnd(.92,1.08);src.frequency.setValueAtTime(base,t);
  for(let i=0;i<syl;i++){const d=rnd(0.11,0.24);const v=VOWELS[Math.floor(Math.random()*VOWELS.length)];
    f1.frequency.setTargetAtTime(v[0],t,0.03);f2.frequency.setTargetAtTime(v[1],t,0.03);
    src.frequency.setTargetAtTime(base*(1+0.18*Math.sin(i*1.3)+(i===syl-1?-0.15:0)),t,0.05);
    g.gain.setTargetAtTime(rnd(0.05,0.09),t,0.02);g.gain.setTargetAtTime(0.004,t+d*0.75,0.03);t+=d;}
  src.start(t0);src.stop(t+0.3);tk.busyUntil=t+rnd(0.6,2.5);
}

  const b=game.bin;b.z=-L.d;b.s=L.s;b.H=BIN0.H*L.s;b.Rt=BIN0.Rt*L.s;b.Rb=BIN0.Rb*L.s;
  frameCamera();
  bar.visible=!!L.bar;
  if(L.bar){BAR.x=i<9?0:rnd(-0.7,0.7);BAR.z=-L.d;bar.position.set(BAR.x,0,BAR.z);b.surf=BAR.y;b.baseX=BAR.x;b.amp=0;}
  else{b.surf=TABLE.y;const lim=TABLE.hx-b.Rt-0.06;b.amp=L.m>0?Math.min(L.m,TABLE.hx-0.24):0;b.baseX=L.m>0?0:(i===0?0:rnd(-1,1)*Math.min(lim,0.12+i*0.07));}
  b.omega=0.7+i*0.05;b.phase=rnd(0,6.28);b.y=b.surf+(b.amp>0?0.075:0);
  robot.visible=b.amp>0;
  binG.scale.set(1,1,1);binHolder.scale.setScalar(L.s);binHolder.position.y=b.y-b.surf;
  binBalls.forEach(m=>m.parent&&m.parent.remove(m));binBalls.length=0;
  floorBalls.forEach(m=>scene.remove(m));floorBalls.length=0;
  ghosts.forEach(g=>scene.remove(g.mesh));ghosts.length=0;
  if(trail){scene.remove(trail);trail=null;}
  fans.forEach(f=>{f.g.position.z=Math.min(-2.7,Math.max(-6,b.z*0.6));});
  updateBin(0);
  newWind();spawnBall();updateHUD();showTurn();
  $('hint').hidden=!(i===0);
  game.state='aim';
}
function newWind(){

  const w=game.wind;$('hWind').textContent=w===0?'still':Math.abs(w).toFixed(1);
  const svg=document.querySelector('#wind svg');svg.style.transform=`scaleX(${w<0?-1:1})`;svg.style.opacity=w===0?0.25:1;

function spawnBall(){

function updateBin(t){
  const b=game.bin;b.x=b.baseX+(b.amp>0?Math.sin(t*b.omega+b.phase)*b.amp:0);

  if(b.amp>0){robot.rotation.y=Math.cos(t*b.omega+b.phase)>0?-Math.PI/2:Math.PI/2;robot.userData.led.material.color.setHSL(.38,1,.45+.2*Math.sin(t*6));}

/* ================= physics ================= */
function stepBall(b,dt,binDX){
  const B=game.bin;
  b.v.y-=G*dt;
  const sp=b.v.length();b.v.addScaledVector(b.v,-DRAG*sp*dt);
  if(!b.inside)b.v.x+=game.wind*dt;
  if(b.inside)b.p.x+=binDX;
  b.p.addScaledVector(b.v,dt);
  const rx=b.p.x-B.x, rz=b.p.z-B.z, ry=b.p.y-B.y;
  let d=Math.hypot(rx,rz);const nx=d>1e-6?rx/d:1, nz=d>1e-6?rz/d:0;
  if(ry>=B.H)b.inside=d<B.Rt;
  const RIM=0.008;
  const cx=nx*B.Rt, cz=nz*B.Rt;
  let dx=rx-cx, dy=ry-B.H, dz=rz-cz;const dist=Math.hypot(dx,dy,dz);
  if(dist<BALL_R+RIM&&dist>1e-6){
    dx/=dist;dy/=dist;dz/=dist;const pen=BALL_R+RIM-dist;
    b.p.x+=dx*pen;b.p.y+=dy*pen;b.p.z+=dz*pen;
    const vn=b.v.x*dx+b.v.y*dy+b.v.z*dz;
    if(vn<0){b.v.x-=1.45*vn*dx;b.v.y-=1.45*vn*dy;b.v.z-=1.45*vn*dz;b.v.multiplyScalar(0.88);
      if(-vn>0.4&&b.t-b.lastRim>0.12){sfx.rim(-vn);b.lastRim=b.t;}
      b.rim=true;b.spin.set(rnd(-20,20),rnd(-20,20),rnd(-20,20));}
  }
  const ry2=b.p.y-B.y;
  if(ry2<B.H&&ry2>-BALL_R){
    const w=B.Rb+(B.Rt-B.Rb)*Math.min(1,Math.max(0,ry2/B.H));
    d=Math.hypot(b.p.x-B.x,b.p.z-B.z);
    if(b.inside){
      if(d>w-BALL_R){const nd=w-BALL_R;b.p.x=B.x+nx*nd;b.p.z=B.z+nz*nd;const vn=b.v.x*nx+b.v.z*nz;if(vn>0){b.v.x-=1.3*vn*nx;b.v.z-=1.3*vn*nz;}}
    }else if(d<w+BALL_R){
      const nd=w+BALL_R;b.p.x=B.x+nx*nd;b.p.z=B.z+nz*nd;const vn=b.v.x*nx+b.v.z*nz;
      if(vn<0){b.v.x-=1.35*vn*nx;b.v.z-=1.35*vn*nz;if(-vn>0.6&&b.t-b.lastRim>0.15){sfx.thud(-vn*0.6);b.lastRim=b.t;}b.rim=true;}
    }
  }
  if(b.inside&&b.p.y<B.y+BALL_R+0.004){b.p.y=B.y+BALL_R+0.004;if(b.v.y<0)b.v.y*=-0.22;b.v.x*=0.92;b.v.z*=0.92;}
  if(b.inside&&!b.scored&&b.p.y-B.y<B.H*0.62){b.scored=true;b.scoredT=b.t;onScore(b);}
  const sup=b.inside?0:surfaceAt(b.p.x,b.p.z,b.p.y-BALL_R);b.support=sup;
  if(!b.inside&&b.p.y<sup+BALL_R){
    b.p.y=sup+BALL_R;
    if(b.v.y<-0.6&&!b.floorHit){sfx.thud(-b.v.y);}
    if(b.v.y<0){b.v.y*=-0.3;b.floorHit=true;}
    b.v.x*=0.94;b.v.z*=0.94;b.spin.multiplyScalar(0.96);
  }
  if(b.p.x<-ROOM.x+BALL_R){b.p.x=-ROOM.x+BALL_R;b.v.x*=-0.4;}
  if(b.p.x>ROOM.x-BALL_R){b.p.x=ROOM.x-BALL_R;b.v.x*=-0.4;}
  if(b.p.z<ROOM.zBack+BALL_R){b.p.z=ROOM.zBack+BALL_R;b.v.z*=-0.4;}
  if(b.p.y>ROOM.h-BALL_R){b.p.y=ROOM.h-BALL_R;b.v.y*=-0.3;}
}
// a colleague's throw replayed in your room (online): flight, wind and bounces, no scoring
function spawnGhost(colorIdx,th){
  const m=new THREE.Mesh(ballGeos[Math.floor(Math.random()*ballGeos.length)],ghostMats[colorIdx%4]);m.castShadow=true;scene.add(m);
  const side=(colorIdx%2?1:-1)*0.28;
  const g={mesh:m,p:new THREE.Vector3(HAND.x+side,HAND.y,HAND.z),v:new THREE.Vector3(Math.sin(th.yaw)*Math.cos(PITCH)*th.sp,Math.sin(PITCH)*th.sp,-Math.cos(th.yaw)*Math.cos(PITCH)*th.sp),w:th.w,t:0};
  ghosts.push(g);if(ghosts.length>8){scene.remove(ghosts[0].mesh);ghosts.shift();}
}
function stepGhost(g,dt){
  g.v.y-=G*dt;const sp=g.v.length();g.v.addScaledVector(g.v,-DRAG*sp*dt);g.v.x+=g.w*dt;g.p.addScaledVector(g.v,dt);
  const sup=surfaceAt(g.p.x,g.p.z,g.p.y-BALL_R);if(g.p.y<sup+BALL_R){g.p.y=sup+BALL_R;if(g.v.y<0)g.v.y*=-0.3;g.v.x*=0.94;g.v.z*=0.94;}
  if(Math.abs(g.p.x)>ROOM.x-BALL_R){g.p.x=Math.sign(g.p.x)*(ROOM.x-BALL_R);g.v.x*=-0.4;}
  if(g.p.z<ROOM.zBack+BALL_R){g.p.z=ROOM.zBack+BALL_R;g.v.z*=-0.4;}
}

/* ================= throwing ================= */
let drag=null;
function refLen(){return Math.min(window.innerHeight*0.62,560);}
canvas.addEventListener('pointerdown',e=>{
  if(game.state!=='aim'||!ball||ball.state!=='hand')return;
  ac();drag={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,id:e.pointerId};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  sfx.crumple();
});
canvas.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){drag.x=e.clientX;drag.y=e.clientY;}});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id)return;
  const dx=drag.x-drag.x0, dy=drag.y-drag.y0;drag=null;
  if(dy>-25||game.state!=='aim'||!ball||ball.state!=='hand')return;
  const s=Math.min(1.1,-dy/refLen());
  throwBall(2.6+8.4*s,Math.atan2(dx,-dy)*0.55);
}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id)drag=null;});

function throwBall(speed,yaw){
  ball.state='fly';ball.t=0;
  ball.v.set(Math.sin(yaw)*Math.cos(PITCH)*speed,Math.sin(PITCH)*speed,-Math.cos(yaw)*Math.cos(PITCH)*speed);
  ball.spin.set(rnd(-12,-4),rnd(-4,4),rnd(-4,4));
  P().throwsLeft--;game.state='flying';sfx.whoosh();track('throws');
  $('hint').hidden=true;
  if(trail){scene.remove(trail);trail=null;}trailPts=[ball.p.clone()];
  if(game.mode==='online')net.throwSeq++,netPresence({th:{seq:net.throwSeq,sp:+speed.toFixed(3),yaw:+yaw.toFixed(4),w:game.wind,lv:game.level}});
  updateHUD();
}

function onScore(b){
  const p=P();p.hits++;p.streak++;
  const swish=!b.rim,L=game.level;
  const mult=Math.min(3,1+0.5*(p.streak-1));
  const pts=Math.round((100+(swish?50:0))*(1+L*0.2)*mult/10)*10;
  p.score+=pts;p.results.push(1);
  earnPoints(pts);track('hits');if(swish)track('swish');
  sfx.paper();if(swish)setTimeout(sfx.swish,80);
  const word=swish?'Swish!':['Treffer!','Drin!','Sauber!','Volltreffer!'][Math.floor(Math.random()*4)];
  let sub='+'+pts;if(p.streak>1)sub+=`  ·  Serie ×${mult.toFixed(1).replace('.0','')}`;
  if(p.hits===levelDef(L).need&&!p.targetHit){p.targetHit=true;sub+='\nZiel erreicht – Rest ist Bonus';}
  toast(word,sub);
  if(game.mode!=='local'&&p.score>best){best=p.score;store.set('best',best);}
  updateHUD();
}
function onMiss(){
  const p=P();p.streak=0;p.results.push(0);
  toast(ball.rim?'Knapp!':['Daneben','Vorbei','Oops'][Math.floor(Math.random()*3)],ball.rim?'Am Rand abgeprallt':'');
  updateHUD();
}
function finishThrow(scored){
  if(trailPts.length>2){
    const g=new THREE.BufferGeometry().setFromPoints(trailPts);
    trail=new THREE.Line(g,new THREE.LineDashedMaterial({color:0xffffff,dashSize:0.06,gapSize:0.07,transparent:true,opacity:0.45}));trail.computeLineDistances();scene.add(trail);
  }
  if(scored){const m=ball.mesh;binG.worldToLocal(m.position);binG.add(m);binBalls.push(m);}
  else{floorBalls.push(ball.mesh);if(floorBalls.length>20)scene.remove(floorBalls.shift());}
  ball=null;game.state='between';
  const L=levelDef(game.level);
  setTimeout(()=>{
    if(game.state!=='between')return;
    if(game.mode!=='local'){
      const p=P();
      if(p.hits+p.throwsLeft<L.need){levelFailed();return;}
      if(p.throwsLeft<=0){levelDone();return;}
    }else{
      const n=game.players.length;let next=-1;
      for(let k=1;k<=n;k++){const j=(game.cur+k)%n,q=game.players[j];if(q.alive&&q.throwsLeft>0){next=j;break;}}
      if(next<0){localLevelEnd();return;}
      game.cur=next;showTurn();
    }
    newWind();spawnBall();updateHUD();game.state='aim';
  },650);
}

function weekKey(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const wd=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-wd);

  store.set('wallet',walletData());
  if(wallet.mode!=='db'||!wallet.ref)return;
  if(wallet.saving){wallet.again=true;return;}       // one write at a time per document
  wallet.saving=true;
  try{await wallet.ref.set(walletData());}
  catch(e){if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,800+Math.random()*800));try{await wallet.ref.set(walletData());}catch(e2){}}
    else if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted'))wallet.mode='local';}
  wallet.saving=false;
  if(wallet.again){wallet.again=false;saveWallet();}
}
let saveTimer=0;function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveWallet,1500);}
async function initWallet(){
  const local=store.get('wallet',null);if(local)cleanWallet(local);
  try{
    const c=window.claude;if(!c||typeof c.use!=='function')return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.collection('data/users/'+id).doc('wallet');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    wallet.ref=ref;wallet.mode='db';
    if(snap&&snap.exists)cleanWallet(snap.data()||{});
    else await saveWallet();           // first visit: move this browser's stars into the account
    store.set('wallet',walletData());
    refreshWalletUI();
  }catch(e){wallet.mode='local';}
}

/* progress events from the game: hits, swish, throws, online, three, level(value=level index reached) */
function track(ev,val=1){
  let changed=false;
  ['d','w','m'].forEach(p=>{const s=taskState(p);TASKS[p].forEach(t=>{
    if(t.id!==ev)return;const before=s.c[t.id]||0;if(before>=t.n)return;
    const v=ev==='level'?(val>=3?1:0):before+val;if(v<=before)return;
    s.c[t.id]=Math.min(t.n,v);changed=true;
    if(s.c[t.id]>=t.n)note(`Aufgabe erledigt: ${t.t} – Belohnung abholen!`);});});
  if(changed)saveSoon();
}
function earnPoints(n){if(game.mode==='local'||!(n>0))return;W.pts+=n;saveSoon();}

const net={api:undefined,room:null,code:null,name:store.get('nick',''),throwSeq:0,seen:{},joinedAt:0,goSeen:0,started:false,unsub:null,lobbyTimer:0,last:{}};
function roomApi(){
  if(net.api!==undefined)return Promise.resolve(net.api);
  const c=window.claude;if(!c||typeof c.use!=='function')return Promise.resolve(null);
  return c.use('room').then(r=>{net.api=r||undefined;return r||null;},()=>{net.api=undefined;return null;});
}
function netPlayers(){
  if(!net.room)return [{name:net.name||'Du',color:0,score:P().score,lv:game.level,me:true}];
  const list=net.room.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.rc===net.code);
  const sorted=list.slice().sort((a,b)=>a.peer<b.peer?-1:1).slice(0,4);
  return sorted.map((p,i)=>({peer:p.peer,me:!!p.sameTab,name:String(p.presence.n||'Gast').slice(0,14),color:i,score:+p.presence.sc||0,lv:typeof p.presence.lv==='number'?p.presence.lv:0,st:p.presence.st,go:+p.presence.go||0}));
}
function netPresence(patch){if(!net.room)return;const full=Object.assign({rc:net.code},patch),out={};let ch=false;
  for(const k in full){const v=JSON.stringify(full[k]);if(net.last[k]!==v){net.last[k]=v;out[k]=full[k];ch=true;}}
  if(ch)net.room.presence(out).catch(()=>{});}
function netLeave(){
  if(net.unsub){net.unsub();net.unsub=null;}
  if(net.room&&net.room!==net.api&&net.room.leave)net.room.leave().catch(()=>{});
  else if(net.room)net.room.presence({rc:null,n:null,sc:null,lv:null,h:null,t:null,st:null,th:null,go:null}).catch(()=>{});
  net.room=null;net.code=null;net.last={};net.started=false;clearInterval(net.lobbyTimer);
  if(/^#pt-/.test(location.hash))try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
}

}
function renderLobby(){
  const ul=$('lobbyList');if(!ul){clearInterval(net.lobbyTimer);return;}
  ul.textContent='';const ps=netPlayers();
  ps.forEach(p=>{const li=document.createElement('li');const i=document.createElement('i');i.style.background=PCOL[p.color].bg;const s=document.createElement('span');s.textContent=p.name+(p.me?' (du)':'');
    const b=document.createElement('b');b.textContent=p.st==='play'?'spielt':'wartet';li.append(i,s,b);
    if(!p.me&&p.peer){const g=document.createElement('button');g.className='btn small gift';g.type='button';
      g.textContent='⭐ schenken';g.disabled=W.stars<1;g.setAttribute('aria-label',`${p.name} einen Stern schenken`);
      g.addEventListener('click',()=>giftStar(p));li.append(g);}
    ul.append(li);});
  const gs=$('giftInfo');if(gs)gs.textContent=`Du hast ${W.stars} ⭐.`;
  if(ps.length<2){const li=document.createElement('li');li.className='out';li.textContent='Warte auf Mitspieler …';ul.append(li);}
}
function beginOnline(){
  if(net.started)return;net.started=true;clearInterval(net.lobbyTimer);
  W.stars=Math.max(0,W.stars-1);saveWallet();track('online');
  game.mode='online';game.players=[newPlayer(net.name,0)];hideMemo();startLevel(0,true);
}

/* ---- gifting stars to friends in the same online room (presence carries the running total sent to each peer) ---- */
const GIFT_MAX=20;   // per sender and room visit
function giftStar(p){
  if(W.stars<1)return;net.gifts=net.gifts||{};
  const sent=net.gifts[p.peer]||0;if(sent>=GIFT_MAX){$('giftInfo').textContent='Genug geschenkt für heute in diesem Raum.';return;}
  net.gifts[p.peer]=sent+1;W.stars--;saveWallet();
  netPresence({gf:Object.assign({},net.gifts)});
  sfx.paper();$('giftInfo').textContent=`1 ⭐ an ${p.name} geschenkt. Du hast noch ${W.stars} ⭐.`;
  renderLobby();
}
function receiveGifts(){
  if(!net.room)return;const me=netPlayers().find(x=>x.me);if(!me||!me.peer)return;
  net.got=net.got||{};
  net.room.peers().forEach(p=>{if(p.sameTab||!p.presence||p.presence.rc!==net.code)return;
    const gf=p.presence.gf;const tot=gf&&typeof gf==='object'?Math.min(GIFT_MAX,Math.max(0,Math.floor(+gf[me.peer]||0))):0;
    const prev=net.got[p.peer]||0;
    if(tot>prev){net.got[p.peer]=tot;const n=tot-prev;const from=String(p.presence.n||'Gast').slice(0,14);
      addStars(n,'von '+from);toast(`Geschenk von ${from}`,`+${n} ⭐`);}});
}
function onNetPeers(ch){
  receiveGifts();
  const me=netPlayers().find(p=>p.me);
  // somebody pressed start after I joined: start too
  if(!net.started&&$('lobbyList')){const go=netPlayers().filter(p=>!p.me&&p.go>net.joinedAt-60000).length;if(go)beginOnline();}
  // replay colleagues' throws on the same level
  const list=net.room?net.room.peers():[];const order=netPlayers();
  list.forEach(p=>{if(p.sameTab||!p.presence||p.presence.rc!==net.code)return;const th=p.presence.th;if(!th||typeof th.seq!=='number'){if(net.seen[p.peer]===undefined)net.seen[p.peer]=0;return;}
    const prev=net.seen[p.peer];net.seen[p.peer]=th.seq;
    if(prev===undefined||prev===th.seq)return;
    if(game.mode==='online'&&game.state!=='menu'&&th.lv===game.level&&isFinite(th.sp)&&isFinite(th.yaw)&&Math.abs(th.sp)<14&&Math.abs(th.yaw)<1.2){
      const o=order.find(x=>x.peer===p.peer);spawnGhost(o?o.color:1,{sp:+th.sp,yaw:+th.yaw,w:Math.max(-5,Math.min(5,+th.w||0))});}
  });
  if(game.mode==='online'&&$('menu').hidden)updateHUDBoardOnly();
  if(ch.joined.some(p=>!p.sameTab)&&game.mode==='online'&&game.state!=='menu')toast('Neu im Raum','');
}
function updateHUDBoardOnly(){const s=game.state;updateHUD();}

/* ================= mute ================= */
function renderMute(){$('muteWave').toggleAttribute('hidden',muted);$('muteX').toggleAttribute('hidden',!muted);$('mute').setAttribute('aria-label',muted?'Ton an':'Ton aus');}
$('mute').addEventListener('click',()=>{muted=!muted;store.set('muted',muted);renderMute();if(!muted){ac();sfx.paper();}radioApply();});
$('radioBtn').addEventListener('click',()=>{radio.on=!radio.on;store.set('radio',radio.on);ac();radioStart();radioApply();renderRadio();});
function renderRadio(){const b=$('radioBtn');b.setAttribute('aria-pressed',radio.on);b.classList.toggle('off',!radio.on);b.title=radio.on?'Radio aus':'Radio an';}
renderRadio();
renderMute();

/* ================= main loop ================= */
let last=performance.now();const STEP=1/480;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min(0.05,(now-last)/1000);last=now;game.t+=dt;
  const t=game.t;
  const oldX=game.bin.x;updateBin(t);const binDX=game.bin.x-oldX;
  if(ball){
    if(ball.state==='hand'){
      const pull=drag?Math.min(1,Math.max(0,-(drag.y-drag.y0)/refLen())):0;
      ball.p.set(HAND.x+(drag?(drag.x-drag.x0)/refLen()*0.08:0),HAND.y+Math.sin(t*2.2)*0.006-pull*0.06,HAND.z+pull*0.08);
      ball.mesh.position.copy(ball.p);ball.mesh.rotation.y+=dt*0.3;
    }else if(ball.state==='fly'){
      const n=Math.max(1,Math.round(dt/STEP));const h=dt/n;
      for(let i=0;i<n;i++){ball.t+=h;stepBall(ball,h,binDX/n);}
      ball.mesh.position.copy(ball.p);
      const sp=ball.v.length();ball.mesh.rotation.x+=ball.spin.x*dt*Math.min(1,sp/3);ball.mesh.rotation.y+=ball.spin.y*dt*Math.min(1,sp/3);ball.mesh.rotation.z+=ball.spin.z*dt*Math.min(1,sp/3);
      if(!ball.scored&&trailPts.length<400&&trailPts[trailPts.length-1].distanceToSquared(ball.p)>0.01)trailPts.push(ball.p.clone());
      if(ball.scored){if(ball.t-ball.scoredT>1.0||(sp<0.08&&ball.t-ball.scoredT>0.3))finishThrow(true);}
      else{
        const onFloor=ball.p.y<=(ball.support||0)+BALL_R+0.002;
        if((onFloor&&sp<0.25)||ball.t>4.5||(ball.floorHit&&ball.t>2.4)){onMiss();finishThrow(false);}
      }
    }
  }
  for(let i=ghosts.length-1;i>=0;i--){const g=ghosts[i];g.t+=dt;const n=Math.max(1,Math.round(dt/(1/240)));for(let k=0;k<n;k++)stepGhost(g,dt/n);g.mesh.position.copy(g.p);g.mesh.rotation.x+=dt*6;
    if(g.t>3.2){g.mesh.material=g.mesh.material;scene.remove(g.mesh);ghosts.splice(i,1);}}
  const w=game.wind;
  fans.forEach(f=>{const active=(w>0&&f.side<0)||(w<0&&f.side>0);const target=active?Math.abs(w)*14:0;f.spin+=(target-f.spin)*Math.min(1,dt*2);f.blades.rotation.x+=f.spin*dt*(f.side<0?-1:1);
    f.head.rotation.y=f.baseRot+Math.sin(t*0.6+f.side)*0.08;});
  if(ceilMixer)ceilMixer.update(dt);
  streakMat.opacity+=((Math.min(0.35,Math.abs(w)*0.12))-streakMat.opacity)*Math.min(1,dt*3);
  if(streakMat.opacity>0.005){for(let i=0;i<STREAKS;i++){const s=streakData[i];s.x+=w*s.s*dt*0.9;
      if(s.x>3.2){s.x=-3.2;s.y=rnd(.4,2.2);s.z=rnd(Math.max(-7.5,game.bin.z-1),-0.5);}if(s.x<-3.2){s.x=3.2;s.y=rnd(.4,2.2);s.z=rnd(Math.max(-7.5,game.bin.z-1),-0.5);}
      const dir=Math.sign(w)||1;streakPos.set([s.x,s.y,s.z,s.x-dir*s.l,s.y,s.z],i*6);}
    streakGeo.attributes.position.needsUpdate=true;}
  streaks.visible=streakMat.opacity>0.005;
  if(game.state==='menu'){camera.position.set(CAM.x+Math.sin(t*0.25)*0.25,CAM.y+0.05,CAM.z);camera.lookAt(0,LOOKY,game.bin.z);}
  else{camera.position.copy(CAM);camera.lookAt(0,LOOKY,game.bin.z);}
  drawTV(t);
  renderer.render(scene,camera);
  drawAim();
}
// swipe line under the finger; the power meter lives fixed on the right edge
function drawAim(){
  const w=window.innerWidth,h=window.innerHeight;actx.clearRect(0,0,w,h);
  const pw=$('power');
  if(!drag){if(pw.classList.contains('on'))pw.classList.remove('on');return;}
  const dx=drag.x-drag.x0,dy=drag.y-drag.y0;
  const s=Math.max(0,Math.min(1.1,-dy/refLen()));const pct=Math.round(s/1.1*100);
  const col=s<0.45?'#3fb35a':s<0.75?'#f2b705':'#ef5b35';
  if(!pw.classList.contains('on'))pw.classList.add('on');
  $('powerFill').style.height=pct+'%';$('powerFill').style.background=col;$('powerPct').textContent=pct+' %';
  pw.setAttribute('aria-valuenow',pct);
  if(dy>-8)return;
  actx.lineCap='round';actx.setLineDash([2,10]);actx.lineWidth=5;actx.strokeStyle='rgba(255,255,255,.85)';
  actx.beginPath();actx.moveTo(drag.x0,drag.y0);actx.lineTo(drag.x,drag.y);actx.stroke();actx.setLineDash([]);
  actx.fillStyle=col;actx.beginPath();actx.arc(drag.x,drag.y,9,0,7);actx.fill();
  actx.strokeStyle='rgba(0,0,0,.35)';actx.lineWidth=2;actx.stroke();
}

/* ================= boot ================= */
game.bin.z=-3;resize();
const inviteCode=(location.hash.match(/^#pt-([a-z0-9]{4})$/)||[])[1];
if(inviteCode)showOnlineSetup(inviteCode);else showStart();
initWallet();
const ld=$('loading');if(ld)ld.textContent='Papierkorb wird geliefert …';
loadBin(()=>{
  const L=levelDef(0),b=game.bin;b.s=L.s;b.H=BIN0.H*L.s;b.Rt=BIN0.Rt*L.s;b.Rb=BIN0.Rb*L.s;binHolder.scale.setScalar(L.s);updateBin(0);
  const l=$('loading');if(l)l.textContent='';
});
requestAnimationFrame(frame);
window.__paperToast={game,throwBall:(s,y)=>throwBall(s,y),get ball(){return ball;},BIN0:()=>BIN0,startLevel,spawnGhost};
})();
</script>
