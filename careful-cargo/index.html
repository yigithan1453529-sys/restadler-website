<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Careful Cargo</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #2d2d2d;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        position: absolute;
        display: block;
        touch-action: none;
        outline: none;
      }
      #rotate {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 12px;
        margin: 0 auto;
        width: max-content;
        max-width: 90%;
        padding: 10px 18px;
        border-radius: 999px;
        background: #ffffff;
        color: #2d2d2d;
        border: 3px solid #2d2d2d;
        font: bold 16px "Trebuchet MS", system-ui, sans-serif;
        text-align: center;
        pointer-events: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate { display: block; }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="rotate"></div>
    <!-- Poki SDK (the only external request; the game also runs without it) -->
    <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
